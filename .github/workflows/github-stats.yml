
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Main GitHub Statistics
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mhkhizil&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Compact Language Statistics
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mhkhizil&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Donut Language Statistics
      - name: Generate Language Donut
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mhkhizil&layout=donut&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/languages-donut.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Featured Open Source Project
      - name: Generate Printer Bridge Project Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mhkhizil&repo=printer-bridge-for-pos-median-compatible&theme=tokyonight&hide_border=true
          path: profile/printer-bridge.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Commit Generated Cards
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "Update GitHub profile stats" || exit 0
          git push
